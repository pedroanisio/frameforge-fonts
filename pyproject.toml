[project]
name = "frameforge-fonts"
version = "0.1.0"
description = "Composition-time font discovery, provisioning, exact shaping, and portable closure for FrameForge"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pedro Anisio Silva", email = "pedroanisio@gmail.com" }]
keywords = ["fonts", "typography", "harfbuzz", "frameforge", "document-composition"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "fonttools>=4.53",
    "uharfbuzz>=0.39",
]

[project.scripts]
ff-fonts = "frameforge_fonts.cli:main"

[project.urls]
Repository = "https://github.com/pedroanisio/frameforge-fonts"
Issues = "https://github.com/pedroanisio/frameforge-fonts/issues"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frameforge_fonts"]

[tool.hatch.build.targets.sdist]
exclude = ["/.agent-tasks", "/.venv", "/dist", "/htmlcov"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]

[tool.coverage.run]
branch = true
source = ["frameforge_fonts"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["frameforge_fonts"]
